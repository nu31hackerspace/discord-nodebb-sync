name: Publish Discord NodeBB Sync images

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: worker
            image: discord-nodebb-sync-worker
            dockerfile: Dockerfile.worker
          - name: nodebb
            image: nodebb-with-discord-sync
            dockerfile: Dockerfile.nodebb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image coordinates
        id: prep
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/${{ matrix.image }}:${{ github.sha }}
